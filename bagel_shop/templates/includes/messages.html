{% if messages %}
    <div class="mb-4" aria-live="polite">
        {% for message in messages %}
            <div class="alert alert-dismissible fade show {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags|default:'info' }}{% endif %} mb-2" role="alert" data-auto-dismiss="6000">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>
{% endif %}
