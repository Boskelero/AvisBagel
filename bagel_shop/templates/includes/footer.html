{% load i18n %}
<footer class="site-footer mt-5 pt-5 pb-4 border-top">
    <div class="container">
        <div class="row g-4 align-items-start">
            <div class="col-md-4">
                <h5 class="fw-bold">{{ SITE_NAME }}</h5>
                <p class="text-muted mb-1">{% trans "Hand-rolled bagels, available through limited preorder Drops." %}</p>
                <p class="text-muted mb-0">{{ SITE_ADDRESS }}</p>
                <p class="text-muted mb-0">{{ SITE_PHONE }}</p>
            </div>
            <div class="col-md-4">
                <h6 class="fw-bold">{% trans "Pickup only" %}</h6>
                <p class="text-muted mb-1">{% trans "Pickup dates and windows are shown on each Drop." %}</p>
                <div class="d-flex gap-3 mt-3">
                    <a href="https://www.instagram.com/abuavibagels/" class="text-decoration-none" rel="noopener" target="_blank">Instagram</a>
                </div>
            </div>
            <div class="col-md-4" id="drop-notify">
                <h6 class="fw-bold">{% trans "Drop notifications" %}</h6>
                <form method="post" action="{% url 'notifications:subscribe' %}" class="d-flex gap-2">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.get_full_path }}">
                    <input type="email" name="email" class="form-control" placeholder="{% trans 'Your email address' %}" required>
                    <button class="btn btn-accent" type="submit">{% trans "Join" %}</button>
                </form>
            </div>
        </div>
    </div>
</footer>
